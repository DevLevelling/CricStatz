# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS WORKFLOW DOES
#
# Every time you push to the `main` branch, GitHub's servers will:
#   1. Spin up a fresh Ubuntu machine
#   2. Download your code
#   3. Install Java (required by Android's build tools)
#   4. Install Flutter
#   5. Build the release APK
#   6. Upload the APK to a GitHub Release tagged "latest"
#
# The website's download button points to the stable GitHub Releases URL:
#   https://github.com/DevLevelling/CricStatz/releases/latest/download/CricStatz.apk
#
# For versioned releases (v1.0.0, v2.1.0, etc.), see release-apk.yml.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Publish APK

permissions:
  contents: write

# ── TRIGGER ──────────────────────────────────────────────────────────────────
# Runs on pushes to `main` that touch files inside `app/` or this workflow file.
# Docs-only, website-only, or design-only changes are skipped to save CI minutes.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

# ── JOBS ─────────────────────────────────────────────────────────────────────
# A workflow can have many parallel "jobs". We only need one here: `build`.
jobs:
  build:
    # The type of machine GitHub will rent for us.
    # ubuntu-latest is free-tier eligible and has Android build tools ready to install.
    runs-on: ubuntu-latest

    # ── STEPS ──────────────────────────────────────────────────────────────
    # Steps run sequentially, top to bottom, inside the same machine.
    steps:

      # STEP 1 ── Check out the code
      # Downloads your whole repo onto the GitHub machine.
      # "actions/checkout" is an official action maintained by GitHub.
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2 ── Set up Java
      # Flutter's Android build needs Java (the Android SDK is Java-based).
      # We use Java 17 (LTS) with the Temurin distribution — same as used by
      # most Android CI setups.
      # `cache: gradle` tells setup-java to cache the Gradle wrapper and
      # downloaded Gradle files between runs — this alone saves 2-3 minutes.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle   # ← caches ~/.gradle between runs

      # STEP 3 ── Set up Flutter
      # Installs a specific Flutter version so every build is reproducible.
      # `cache: true` caches the entire Flutter SDK (~600 MB) between runs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      # STEP 4 ── Cache pub packages
      # Caches ~/.pub-cache keyed on pubspec.lock.
      # If pubspec.lock hasn't changed, packages are restored instantly
      # instead of re-downloaded from pub.dev.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # STEP 5 ── Get dependencies
      # With the pub cache restored above, this is nearly instant on repeat
      # runs — it just re-links already-cached packages.
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      # STEP 6 ── Build the release APK
      # This is the main event.
      # `--release`  → obfuscated, minified, signed with the debug key by default.
      # The output lands at:  app/build/app/outputs/flutter-apk/app-release.apk
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      # STEP 7 ── Upload APK to GitHub Release (rolling "latest")
      # Creates or updates a release tagged "latest" with the freshly-built APK.
      # The stable download URL is:
      #   https://github.com/DevLevelling/CricStatz/releases/latest/download/CricStatz.apk
      #
      # `softprops/action-gh-release` handles creating the tag, the release,
      # and uploading the asset file. If the release already exists it updates it.
      # `GITHUB_TOKEN` is provided automatically by GitHub Actions.
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automatically updated on every push to main.
            Built from commit ${{ github.sha }}.
          make_latest: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
