# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS WORKFLOW DOES
#
# When you push a semver git tag (e.g. v1.0.0, v2.1.3), this workflow:
#   1. Builds the release APK
#   2. Creates a GitHub Release tagged with that version
#   3. Auto-generates release notes from commits since the last tag
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The rolling "latest" release (updated on every push to main) is handled
# separately by build-apk.yml.
# ─────────────────────────────────────────────────────────────────────────────

name: Release APK (Versioned)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'    # e.g. v1.0.0, v2.1.3

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CricStatz ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
